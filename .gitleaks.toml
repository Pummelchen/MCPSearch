# gitleaks configuration — MCPSearch
#
# This file exists for exactly one reason, recorded in the audit ledger as task A06:
#
#   Commit 41d56935 introduced five occurrences of a *synthetic* key literal
#   (`sk-test-key-…`) in two test files, so that tests could exercise the "a usable key is
#   configured" path. gitleaks' `generic-api-key` rule flags them, and `gitleaks detect
#   --log-opts=--all` therefore reports five findings on every full-history scan.
#
#   They are not credentials: they were never valid, they are in the test target only, and the
#   tests that would spend real provider credit are gated behind `SEARCH_LIVE_TESTS` plus a
#   usable key. The working tree no longer contains the literal at all — it is now
#   `Fixtures.syntheticDeepSeekKey`, a run of zeroes — but it cannot be removed from *history*
#   without rewriting history, which the audit brief forbids.
#
# The audit brief permits a scanner finding to be "waived in writing"; this is that waiver, and
# it is deliberately narrow:
#
#   * `condition = "AND"` means a finding is waived only when the path is one of the two test
#     files *and* the matched value is that exact synthetic literal;
#   * `[extend] useDefault = true` keeps the entire default ruleset, so this file cannot make
#     the scanner blind to anything else. The negative control for that lives in the ledger's
#     A06 evidence: a scanner-shaped value placed outside these paths is still reported.
#
# Revisit if these files are ever rewritten: the allowlist should be deleted, not kept.

[extend]
useDefault = true

[[allowlists]]
description = "Synthetic non-credential key literals in two test files (ledger A06, commit 41d56935)"
condition = "AND"
paths = [
  '''Tests/WebSearchCoreTests/StdioServerTests\.swift''',
  '''Tests/WebSearchCoreTests/AnswerSynthesizerTests\.swift''',
]
regexes = ['''sk-test-key-0123456789abcdef''']
